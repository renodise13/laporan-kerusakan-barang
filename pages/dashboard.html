<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Laporan Kerusakan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="dashboard-user" data-require-auth="true" data-role="user">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">L</div>
          <div>
            <div class="brand-name">Laporan Kerusakan</div>
            <small>Reporting system</small>
          </div>
        </div>

        <nav class="side-nav">
          <a href="dashboard.html" class="nav-item active">Dashboard</a>
          <a href="buat-laporan.html" class="nav-item">Buat Laporan</a>
          <a href="riwayat.html" class="nav-item">Riwayat Laporan</a>
          <a href="profil.html" class="nav-item">Profil</a>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button">Keluar</button>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="topbar-label">Selamat datang</p>
            <h1 id="welcomeName">Memuat...</h1>
          </div>
          <a href="buat-laporan.html" class="primary-btn small-btn">+ Buat Laporan</a>
        </header>

        <section class="stats-grid">
          <article class="stat-card warning-card">
            <span>Menunggu</span>
            <strong id="countWaiting">0</strong>
          </article>
          <article class="stat-card info-card">
            <span>Sedang Diproses</span>
            <strong id="countProcess">0</strong>
          </article>
          <article class="stat-card success-card">
            <span>Selesai</span>
            <strong id="countDone">0</strong>
          </article>
          <article class="stat-card total-card">
            <span>Total Laporan</span>
            <strong id="countTotal">0</strong>
          </article>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Laporan terbaru</h2>
            <a href="riwayat.html">Lihat semua</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nomor Tiket</th>
                  <th>Barang</th>
                  <th>Lokasi</th>
                  <th>Tanggal</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="latestReportsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/laporan.js"></script>
  </body>
</html>
